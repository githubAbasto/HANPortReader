<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HANPortReader Setup</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#fff;color:#1a2b1a;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px 48px}
header{text-align:center;margin-bottom:28px}
.logo{font-size:1.6rem;font-weight:800;color:#3a7d44;letter-spacing:-0.02em}
.logo span{color:#1a2b1a}
.tagline{margin-top:4px;font-size:0.82rem;color:#3a7d44;font-style:italic}
h1{font-size:1.1rem;font-weight:600;margin-bottom:20px}
.card{width:100%;max-width:460px;background:#f9faf9;border:1px solid #ccd9cc;border-radius:8px;padding:18px 22px;margin-bottom:18px}
.card h2{font-size:0.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#3a7d44;margin-bottom:14px;padding-bottom:7px;border-bottom:1px solid #ccd9cc}
.field{margin-bottom:12px}
.field:last-child{margin-bottom:0}
label{display:block;font-size:0.8rem;font-weight:600;margin-bottom:4px}
input,select{width:100%;padding:8px 11px;border:1px solid #aac0aa;border-radius:5px;font-size:0.88rem;color:#1a2b1a;background:#fff;outline:none}
input:focus,select:focus{border-color:#3a7d44;box-shadow:0 0 0 2px #3a7d4420}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:60px}
.pw-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:0.72rem;color:#3a7d44;font-weight:700;padding:4px}
.scan-row{display:flex;gap:8px;align-items:flex-end}
.scan-row select{flex:1}
.scan-btn{white-space:nowrap;padding:8px 13px;background:#f0f5f0;border:1px solid #aac0aa;border-radius:5px;font-size:0.8rem;font-weight:700;color:#3a7d44;cursor:pointer}
.scan-btn:hover{background:#e2eee2}
#ssid-manual{display:none;margin-top:7px}
.hint{display:block;margin-top:3px;font-size:0.75rem;color:#5a7a5a}
.save-btn{display:block;width:100%;max-width:460px;padding:12px;background:#3a7d44;color:#fff;border:none;border-radius:6px;font-size:0.95rem;font-weight:700;cursor:pointer;margin-top:2px}
.save-btn:hover{background:#2e6335}
.save-btn:disabled{background:#7aab82;cursor:default}
#status{max-width:460px;width:100%;text-align:center;margin-top:12px;font-size:0.85rem;min-height:20px;color:#3a7d44;font-weight:600}
#status.err{color:#c0392b}
</style>
</head>
<body>
<header>
  <div class="logo">Power<span>Concern</span></div>
  <p class="tagline">Reigniting the joy to care</p>
</header>
<h1>Device Setup</h1>

<div class="card">
  <h2>Network &amp; Identity</h2>
  <div class="field">
    <label for="hostname">Device hostname</label>
    <input id="hostname" type="text" placeholder="hanreader" autocomplete="off">
    <span class="hint">Accessible as <span id="hn-preview">hanreader</span>.local</span>
  </div>
  <div class="field">
    <label for="site-id">Site ID</label>
    <input id="site-id" type="text" placeholder="PC-XXXXXXXX" autocomplete="off">
  </div>
  <div class="field">
    <label for="site-pos">Site position</label>
    <input id="site-pos" type="text" placeholder="wallbox" autocomplete="off">
  </div>
</div>

<div class="card">
  <h2>WiFi</h2>
  <div class="field">
    <label>WiFi network</label>
    <div class="scan-row">
      <select id="ssid-sel"><option value="">-- Tap Scan --</option></select>
      <button class="scan-btn" onclick="doScan()">Scan</button>
    </div>
    <input id="ssid-manual" type="text" placeholder="Enter SSID manually" autocomplete="off">
  </div>
  <div class="field">
    <label for="wifi-pass">WiFi password</label>
    <div class="pw-wrap">
      <input id="wifi-pass" type="password" autocomplete="off">
      <button class="pw-toggle" type="button" onclick="togglePw('wifi-pass',this)">Show</button>
    </div>
  </div>
</div>

<div class="card">
  <h2>MQTT Broker</h2>
  <div class="field">
    <label for="mqtt-server">MQTT server</label>
    <input id="mqtt-server" type="text" placeholder="broker.example.com:1883" autocomplete="off">
  </div>
  <div class="field">
    <label for="mqtt-user">Username</label>
    <input id="mqtt-user" type="text" autocomplete="off">
  </div>
  <div class="field">
    <label for="mqtt-pass">Password</label>
    <div class="pw-wrap">
      <input id="mqtt-pass" type="password" autocomplete="off">
      <button class="pw-toggle" type="button" onclick="togglePw('mqtt-pass',this)">Show</button>
    </div>
  </div>
</div>

<button class="save-btn" id="save-btn" onclick="doSave()">Save &amp; Reboot</button>
<div id="status"></div>

<script>
function rpc(m,p,cb,timeout){
  var done=false;
  var ctrl=typeof AbortController!=='undefined'?new AbortController():null;
  var tid=setTimeout(function(){
    if(done)return;done=true;
    if(ctrl)ctrl.abort();
    cb('Timeout',null);
  },timeout||15000);
  fetch('/rpc/'+m,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(p||{}),
    signal:ctrl?ctrl.signal:undefined
  })
  .then(function(r){return r.json();})
  .then(function(j){
    if(done)return;done=true;clearTimeout(tid);
    if(j&&j.error)cb(j.error.message||'RPC error',null);
    else cb(null,j);
  })
  .catch(function(e){
    if(done)return;done=true;clearTimeout(tid);
    cb(e.name==='AbortError'?'Timeout':e.message||'Fetch error',null);
  });
}

function setStatus(m,e){var el=document.getElementById('status');el.textContent=m;el.className=e?'err':'';}
function togglePw(id,btn){var i=document.getElementById(id);i.type=i.type==='password'?'text':'password';btn.textContent=i.type==='password'?'Show':'Hide';}

document.getElementById('hostname').addEventListener('input',function(){
  document.getElementById('hn-preview').textContent=this.value||'hanreader';
});

function doScan(){
  var sel=document.getElementById('ssid-sel');
  sel.innerHTML='<option value="">Scanning…</option>';
  rpc('Wifi.Scan',{},function(err,res){
    sel.innerHTML='';
    if(err||!res||!res.results||!res.results.length){
      sel.innerHTML='<option value="__m__">Enter manually</option>';
      document.getElementById('ssid-manual').style.display='block';
      return;
    }
    var nets=res.results.slice().sort(function(a,b){return b.rssi-a.rssi;});
    for(var i=0;i<nets.length;i++){
      var o=document.createElement('option');
      o.value=nets[i].ssid;
      o.textContent=nets[i].ssid+' ('+nets[i].rssi+' dBm)';
      sel.appendChild(o);
    }
    var m=document.createElement('option');m.value='__m__';m.textContent='— Enter manually —';
    sel.appendChild(m);
    sel.onchange=function(){document.getElementById('ssid-manual').style.display=this.value==='__m__'?'block':'none';};
  });
}

function prefill(){
  setStatus('Loading config…');
  rpc('Config.Get',{key:'wifi.sta'},function(e,r){
    if(!e&&r){
      var s=document.getElementById('ssid-sel');
      if(r.ssid){s.innerHTML='';var o=document.createElement('option');o.value=r.ssid;o.textContent=r.ssid+' (current)';s.appendChild(o);}
      document.getElementById('wifi-pass').value=r.pass||'';
    }
  });
  rpc('Config.Get',{key:'mqtt'},function(e,r){
    if(!e&&r){
      document.getElementById('mqtt-server').value=r.server||'';
      document.getElementById('mqtt-user').value=r.user||'';
      document.getElementById('mqtt-pass').value=r.password||'';
    }
  });
  rpc('Config.Get',{key:'site'},function(e,r){
    if(!e&&r){
      document.getElementById('site-id').value=r.id||'';
      document.getElementById('site-pos').value=r.position||'';
    }
    setStatus('');
  });
  rpc('Config.Get',{key:'wifi.sta.hostname'},function(e,r){
    if(!e&&r){
      var h=typeof r==='string'?r:(r.hostname||'');
      if(h){document.getElementById('hostname').value=h;document.getElementById('hn-preview').textContent=h;}
    }
  });
}

function setKey(obj,key,val){
  var p=key.split('.'),o=obj;
  for(var i=0;i<p.length-1;i++){o[p[i]]=o[p[i]]||{};o=o[p[i]];}
  o[p[p.length-1]]=val;
}

function doSave(){
  var btn=document.getElementById('save-btn');
  btn.disabled=true;setStatus('Saving…');
  var sel=document.getElementById('ssid-sel');
  var ssid=sel.value==='__m__'?document.getElementById('ssid-manual').value.trim():sel.value;
  var fields=[
    ['wifi.sta.ssid',ssid],
    ['wifi.sta.pass',document.getElementById('wifi-pass').value],
    ['wifi.sta.hostname',document.getElementById('hostname').value.trim()||'hanreader'],
    ['mqtt.server',document.getElementById('mqtt-server').value.trim()],
    ['mqtt.user',document.getElementById('mqtt-user').value],
    ['mqtt.password',document.getElementById('mqtt-pass').value],
    ['site.id',document.getElementById('site-id').value.trim()],
    ['site.position',document.getElementById('site-pos').value.trim()],
  ];
  var i=0,errs=0;
  function next(){
    if(i>=fields.length){
      if(errs){setStatus('Some settings failed to save.',true);btn.disabled=false;return;}
      setStatus('Saved! Rebooting…');
      setTimeout(function(){rpc('Sys.Reboot',{delay_ms:1000},function(){});},400);
      return;
    }
    var cfg={};setKey(cfg,fields[i][0],fields[i][1]);
    rpc('Config.Set',{config:cfg},function(e){if(e)errs++;i++;next();});
  }
  next();
}

window.onload=prefill;
</script>
</body>
</html>

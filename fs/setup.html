<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HANPortReader Setup</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #ffffff;
    color: #1a2b1a;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
  }
  header {
    text-align: center;
    margin-bottom: 32px;
  }
  header img { max-width: 162px; height: auto; }
  header p {
    margin-top: 6px;
    font-size: 0.85rem;
    letter-spacing: 0.08em;
    color: #3a7d44;
    font-style: italic;
  }
  h1 {
    font-size: 1.25rem;
    font-weight: 600;
    color: #1a2b1a;
    margin-bottom: 24px;
  }
  .card {
    width: 100%;
    max-width: 480px;
    background: #f9faf9;
    border: 1px solid #ccd9cc;
    border-radius: 8px;
    padding: 20px 24px;
    margin-bottom: 20px;
  }
  .card h2 {
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #3a7d44;
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid #ccd9cc;
  }
  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  label {
    display: block;
    font-size: 0.82rem;
    font-weight: 600;
    margin-bottom: 5px;
    color: #1a2b1a;
  }
  input, select {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid #aac0aa;
    border-radius: 5px;
    font-size: 0.9rem;
    color: #1a2b1a;
    background: #fff;
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus, select:focus { border-color: #3a7d44; box-shadow: 0 0 0 2px #3a7d4420; }
  .pw-wrap { position: relative; }
  .pw-wrap input { padding-right: 70px; }
  .pw-toggle {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    font-size: 0.75rem;
    color: #3a7d44;
    font-weight: 600;
    padding: 4px 6px;
  }
  .wifi-row { display: flex; gap: 8px; align-items: flex-end; }
  .wifi-row select { flex: 1; }
  .scan-btn {
    white-space: nowrap;
    padding: 9px 14px;
    background: #f0f5f0;
    border: 1px solid #aac0aa;
    border-radius: 5px;
    font-size: 0.82rem;
    font-weight: 600;
    color: #3a7d44;
    cursor: pointer;
  }
  .scan-btn:hover { background: #e2eee2; }
  #ssid-manual { display: none; margin-top: 8px; }
  .save-btn {
    display: block;
    width: 100%;
    max-width: 480px;
    padding: 13px;
    background: #3a7d44;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.04em;
    margin-top: 4px;
    transition: background 0.15s;
  }
  .save-btn:hover { background: #2e6335; }
  .save-btn:disabled { background: #7aab82; cursor: default; }
  #status {
    max-width: 480px;
    width: 100%;
    text-align: center;
    margin-top: 14px;
    font-size: 0.88rem;
    min-height: 22px;
    color: #3a7d44;
    font-weight: 600;
  }
  #status.err { color: #c0392b; }
</style>
</head>

<h1>HANPortReader Setup</h1>

<div class="card">
  <h2>Network &amp; Identity</h2>
  <div class="field">
    <label for="hostname">Device hostname</label>
    <input id="hostname" type="text" placeholder="hanreader" autocomplete="off" spellcheck="false">
    <small style="display:block;margin-top:4px;color:#5a7a5a;font-size:0.78rem">Accessible as <span id="hostname-preview">hanreader</span>.local after reboot</small>
  </div>
  <div class="field">
    <label for="site-id">Site ID</label>
    <input id="site-id" type="text" placeholder="mainutilitymeter" autocomplete="off">
  </div>
  <div class="field">
    <label for="site-pos">Site position</label>
    <input id="site-pos" type="text" placeholder="wallbox" autocomplete="off">
  </div>
</div>

<div class="card">
  <h2>WiFi</h2>
  <div class="field">
    <label for="ssid-select">WiFi network</label>
    <div class="wifi-row">
      <select id="ssid-select">
        <option value="">-- Scanning… --</option>
      </select>
      <button class="scan-btn" onclick="doScan()">Scan</button>
    </div>
    <input id="ssid-manual" type="text" placeholder="Enter SSID manually" autocomplete="off" spellcheck="false">
  </div>
  <div class="field">
    <label for="wifi-pass">WiFi password</label>
    <div class="pw-wrap">
      <input id="wifi-pass" type="password" autocomplete="off">
      <button class="pw-toggle" type="button" onclick="togglePw('wifi-pass',this)">Show</button>
    </div>
  </div>
</div>

<div class="card">
  <h2>MQTT Broker</h2>
  <div class="field">
    <label for="mqtt-server">MQTT server</label>
    <input id="mqtt-server" type="text" placeholder="broker.example.com:1883" autocomplete="off" spellcheck="false">
  </div>
  <div class="field">
    <label for="mqtt-user">MQTT username</label>
    <input id="mqtt-user" type="text" autocomplete="off">
  </div>
  <div class="field">
    <label for="mqtt-pass">MQTT password</label>
    <div class="pw-wrap">
      <input id="mqtt-pass" type="password" autocomplete="off">
      <button class="pw-toggle" type="button" onclick="togglePw('mqtt-pass',this)">Show</button>
    </div>
  </div>
</div>

<button class="save-btn" id="save-btn" onclick="doSave()">Save &amp; Reboot</button>
<div id="status"></div>

<script>
var RPC_URL = 'ws://192.168.4.1/rpc';
var ws;
var pendingCalls = {};
var callId = 1;

function openWs(cb) {
  if (ws && ws.readyState === 1) { cb(null); return; }
  ws = new WebSocket(RPC_URL);
  ws.onopen = function() { cb(null); };
  ws.onerror = function(e) { cb('WebSocket error'); };
  ws.onmessage = function(ev) {
    var resp;
    try { resp = JSON.parse(ev.data); } catch(e) { return; }
    var id = resp.id;
    if (id && pendingCalls[id]) {
      var cb2 = pendingCalls[id];
      delete pendingCalls[id];
      if (resp.error) cb2(resp.error.message || 'RPC error', null);
      else cb2(null, resp.result);
    }
  };
  ws.onclose = function() { ws = null; };
}

function rpc(method, params, cb) {
  openWs(function(err) {
    if (err) { cb(err, null); return; }
    var id = callId++;
    pendingCalls[id] = cb;
    ws.send(JSON.stringify({id: id, method: method, params: params || {}}));
  });
}

function setStatus(msg, isErr) {
  var el = document.getElementById('status');
  el.textContent = msg;
  el.className = isErr ? 'err' : '';
}

function togglePw(id, btn) {
  var inp = document.getElementById(id);
  if (inp.type === 'password') { inp.type = 'text'; btn.textContent = 'Hide'; }
  else { inp.type = 'password'; btn.textContent = 'Show'; }
}

// Update hostname preview
document.getElementById('hostname').addEventListener('input', function() {
  document.getElementById('hostname-preview').textContent = this.value || 'hanreader';
});

function doScan() {
  var sel = document.getElementById('ssid-select');
  sel.innerHTML = '<option value="">-- Scanning… --</option>';
  rpc('Wifi.Scan', {}, function(err, result) {
    sel.innerHTML = '';
    if (err || !result || !result.results || result.results.length === 0) {
      // Fall back to manual entry
      sel.innerHTML = '<option value="__manual__">Enter manually</option>';
      document.getElementById('ssid-manual').style.display = 'block';
      return;
    }
    var nets = result.results.slice().sort(function(a,b){ return b.rssi - a.rssi; });
    for (var i = 0; i < nets.length; i++) {
      var o = document.createElement('option');
      var bars = nets[i].rssi >= -60 ? '▂▄▆█' : nets[i].rssi >= -75 ? '▂▄▆_' : nets[i].rssi >= -85 ? '▂▄__' : '▂___';
      o.value = nets[i].ssid;
      o.textContent = nets[i].ssid + '  ' + bars + ' (' + nets[i].rssi + ' dBm)';
      sel.appendChild(o);
    }
    var manual = document.createElement('option');
    manual.value = '__manual__';
    manual.textContent = '— Enter manually —';
    sel.appendChild(manual);
    sel.onchange = function() {
      document.getElementById('ssid-manual').style.display = (this.value === '__manual__') ? 'block' : 'none';
    };
  });
}

function prefill() {
  setStatus('Loading current config…');
  rpc('Config.Get', {key: 'wifi.sta'}, function(err, r) {
    if (!err && r) {
      var ssid = r.ssid || '';
      if (ssid) {
        var sel = document.getElementById('ssid-select');
        // Add current SSID as first option so it shows even before scan
        sel.innerHTML = '';
        var o = document.createElement('option');
        o.value = ssid; o.textContent = ssid + '  (current)'; o.selected = true;
        sel.appendChild(o);
        var manual = document.createElement('option');
        manual.value = '__manual__'; manual.textContent = '— Enter manually —';
        sel.appendChild(manual);
        sel.onchange = function() {
          document.getElementById('ssid-manual').style.display = (this.value === '__manual__') ? 'block' : 'none';
        };
      }
      document.getElementById('wifi-pass').value = r.pass || '';
    }
  });
  rpc('Config.Get', {key: 'mqtt'}, function(err, r) {
    if (!err && r) {
      document.getElementById('mqtt-server').value = r.server || '';
      document.getElementById('mqtt-user').value = r.user || '';
      document.getElementById('mqtt-pass').value = r.password || '';
    }
  });
  rpc('Config.Get', {key: 'site'}, function(err, r) {
    if (!err && r) {
      document.getElementById('site-id').value = r.id || '';
      document.getElementById('site-pos').value = r.position || '';
    }
    setStatus('');
  });
  rpc('Config.Get', {key: 'wifi.sta.hostname'}, function(err, r) {
    if (!err && r !== null && r !== undefined) {
      var hn = (typeof r === 'object' && r.hostname) ? r.hostname : (typeof r === 'string' ? r : '');
      if (hn) {
        document.getElementById('hostname').value = hn;
        document.getElementById('hostname-preview').textContent = hn;
      }
    }
  });
  doScan();
}

function doSave() {
  var btn = document.getElementById('save-btn');
  btn.disabled = true;
  setStatus('Saving…');

  var sel = document.getElementById('ssid-select');
  var ssid = sel.value === '__manual__'
    ? document.getElementById('ssid-manual').value.trim()
    : sel.value;

  var configs = [
    ['wifi.sta.ssid',     ssid],
    ['wifi.sta.pass',     document.getElementById('wifi-pass').value],
    ['wifi.sta.hostname', document.getElementById('hostname').value.trim() || 'hanreader'],
    ['mqtt.server',       document.getElementById('mqtt-server').value.trim()],
    ['mqtt.user',         document.getElementById('mqtt-user').value],
    ['mqtt.password',     document.getElementById('mqtt-pass').value],
    ['site.id',           document.getElementById('site-id').value.trim()],
    ['site.position',     document.getElementById('site-pos').value.trim()],
  ];

  var saved = 0;
  var failed = 0;

  function saveNext(idx) {
    if (idx >= configs.length) {
      if (failed > 0) {
        setStatus('Some settings failed to save. Check connection.', true);
        btn.disabled = false;
        return;
      }
      setStatus('Saved. Rebooting device…');
      setTimeout(function() {
        rpc('Sys.Reboot', {delay_ms: 1000}, function() {});
      }, 300);
      return;
    }
    var key = configs[idx][0];
    var val = configs[idx][1];
    var params = {config: {}};
    // Build nested object from dot-notation key
    var parts = key.split('.');
    var obj = params.config;
    for (var i = 0; i < parts.length - 1; i++) {
      obj[parts[i]] = obj[parts[i]] || {};
      obj = obj[parts[i]];
    }
    obj[parts[parts.length - 1]] = val;
    rpc('Config.Set', params, function(err) {
      if (err) failed++;
      saveNext(idx + 1);
    });
  }
  saveNext(0);
}

window.onload = prefill;
</script>
</body>

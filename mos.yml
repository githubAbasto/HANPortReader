author: Fredrik Svensson 
description: A JS implentation of HAN Port reader over MQTT
arch: ESP32
version: 1.0
manifest_version: 2017-05-18
libs_version: ${mos.version}
modules_version: ${mos.version}
mongoose_os_version: ${mos.version}

config_schema:
  - [mqtt.enable", true]
  - ["mqtt.server", "mqtt.symlink.se:1883"]
  - ["mqtt.user",""]
  - ["wifi.ap.enable", true]
  - ["wifi.ap.trigger_on_gpio", 0]
  - ["wifi.ap.hostname", "HANReader"]
  - ["wifi.ap.pass", "powerconcern"]
  - ["rpc.enable", true]
  - ["mqtt.enable", true]
  - ["site", "o", {hide: true}]
  - ["site.id", "s",  "mainutilitymeter", {title: "Site name/location"}]
  - ["site.position", "s", "wallbox", {title: "Electrical cabinette position"}]
  - ["wifi.sta.hostname", "s", "hanreader", {title: "mDNS hostname (used as hostname.local)"}]
  - ["cportal.enable", "b", true, {title: "Enable WiFi captive portal on device boot"}]
  - ["cportal.index", "s", "index.html", {title: "Filename of HTML file to use when serving the captive portal index file"}]
  - ["cportal.any", "b", true, {title: "Return index file for any non-hostname matching requests"}]


tags:
  - js
  - c
sources:
 - src 

filesystem:
  - fs

libs:
 - origin:  https://github.com/mongoose-os-libs/mjs
 - origin:  https://github.com/mongoose-os-libs/ca-bundle
 - origin:  https://github.com/mongoose-os-libs/mqtt
 - origin: https://github.com/mongoose-os-libs/wifi
 - origin: https://github.com/mongoose-os-libs/rpc-service-fs
 - origin: https://github.com/mongoose-os-libs/rpc-uart
 - origin: https://github.com/mongoose-os-libs/rpc-ws
 - origin: https://github.com/mongoose-os-libs/rpc-service-wifi
 - origin: https://github.com/mongoose-os-libs/rpc-service-config
 - origin: https://github.com/mongoose-os-libs/ota-http-server
 - origin: https://github.com/tripflex/captive-portal

